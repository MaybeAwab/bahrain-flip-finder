[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bahrain-flip-finder"
version = "0.1.0"
description = "Market analysis tool for used-electronics resale opportunities in Bahrain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Awab Al-Muaalemi" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
flip-finder = "flip_finder.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

